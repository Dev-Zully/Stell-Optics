name: Basename Collision Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write  # needed to post the PR comment

jobs:
  basename-collision:
    name: Check for duplicate basenames in added files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run basename collision check
        id: collision
        # Exit code 1 means collisions found; we handle that with the PR
        # comment below rather than failing the build outright.
        continue-on-error: true
        run: |
          node scripts/check-basename-collisions.mjs --base origin/${{ github.base_ref }}
        env:
          GITHUB_OUTPUT: ${{ github.output }}

      - name: Post PR comment if collisions found
        if: steps.collision.outcome == 'failure' && steps.collision.outputs.collision_count != '0'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const report = process.env.COLLISION_REPORT.replace(/%0A/g, '\n').replace(/%0D/g, '\r');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: report,
            });
        env:
          COLLISION_REPORT: ${{ steps.collision.outputs.collision_report }}

      - name: Summarise result
        if: always()
        run: |
          COUNT="${{ steps.collision.outputs.collision_count }}"
          if [ -z "$COUNT" ] || [ "$COUNT" = "0" ]; then
            echo "✅  No basename collisions detected in this PR."
          else
            echo "⚠️  $COUNT basename collision(s) detected — see the PR comment for details."
            echo "    This is a warning, not a hard failure. Review and confirm intent before merging."
          fi
