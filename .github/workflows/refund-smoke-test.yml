name: refund-smoke-test

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  refund-smoke-test:
    name: Refund smoke test (Trustless Work testnet)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run refund smoke test against Trustless Work testnet
        working-directory: backend
        env:
          TRUSTLESS_WORK_API_KEY: ${{ secrets.TRUSTLESS_WORK_API_KEY }}
          TRUSTLESS_WORK_DISPUTE_RESOLVER_SECRET: ${{ secrets.TRUSTLESS_WORK_DISPUTE_RESOLVER_SECRET }}
          TRUSTLESS_WORK_BASE_URL: ${{ secrets.TRUSTLESS_WORK_BASE_URL || 'https://api.testnet.trustlesswork.com' }}
          TRUSTLESS_WORK_TESTNET_ESCROW_ID: ${{ secrets.TRUSTLESS_WORK_TESTNET_ESCROW_ID }}
          TRUSTLESS_WORK_TESTNET_CONTRACT_ID: ${{ secrets.TRUSTLESS_WORK_TESTNET_CONTRACT_ID }}
        run: npm run smoke:refund